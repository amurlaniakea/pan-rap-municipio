<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PAN-RAP Municipio — Fase 5.5 (Blind Schnorr)</title>
    <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .btn { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 0.5rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-bottom: 1rem; padding: 0.5rem; background: #1e293b; border-radius: 0.5rem; }
  </style>
</head>
<body>
  <h1>🏛️ PAN-RAP Municipio: Propuesta #2 (Fase 5 — Blind Schnorr)</h1>
  <div id="status">⏳ Cargando cliente Schnorr...</div>
  <button class="btn" onclick="window.flujoVoto('a_favor', 'http://localhost:8000/convocatorias/test/emision/inicio', 'http://localhost:8000/convocatorias/test/emision/fin', 'http://localhost:8000/convocatorias/test/votos').then(r => { document.getElementById('status').innerText = '✅ ' + r.mensaje; document.querySelectorAll('.btn').forEach(b => b.disabled = true); }).catch(e => { document.getElementById('status').innerText = '❌ ' + e.message; });">👍 A Favor</button>
  <button class="btn" onclick="window.flujoVoto('en_contra', 'http://localhost:8000/convocatorias/test/emision/inicio', 'http://localhost:8000/convocatorias/test/emision/fin', 'http://localhost:8000/convocatorias/test/votos').then(r => { document.getElementById('status').innerText = '✅ ' + r.mensaje; document.querySelectorAll('.btn').forEach(b => b.disabled = true); }).catch(e => { document.getElementById('status').innerText = '❌ ' + e.message; });">👎 En Contra</button>
  <button class="btn" onclick="window.flujoVoto('abstencion', 'http://localhost:8000/convocatorias/test/emision/inicio', 'http://localhost:8000/convocatorias/test/emision/fin', 'http://localhost:8000/convocatorias/test/votos').then(r => { document.getElementById('status').innerText = '✅ ' + r.mensaje; document.querySelectorAll('.btn').forEach(b => b.disabled = true); }).catch(e => { document.getElementById('status').innerText = '❌ ' + e.message; });">⚪ Abstención</button>

  <script type="module" src="voto.bundle.js"></script>
</body>
</html>
